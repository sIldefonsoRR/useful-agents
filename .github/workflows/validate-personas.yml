name: Validate personas

on:
  push:
    branches: [main]
    paths:
      - "personas/**"
      - ".github/agents/**"
      - "scripts/validate-frontmatter.py"
      - ".github/workflows/validate-personas.yml"
  pull_request:
    paths:
      - "personas/**"
      - ".github/agents/**"
      - "scripts/validate-frontmatter.py"
      - ".github/workflows/validate-personas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate persona and agent frontmatter
        run: python3 scripts/validate-frontmatter.py
