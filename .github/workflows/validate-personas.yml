name: Validate personas

on:
  push:
    branches: [main]
    paths:
      - "personas/**"
      - ".github/agents/**"
      - "scripts/**"
      - ".github/workflows/validate-personas.yml"
  pull_request:
    paths:
      - "personas/**"
      - ".github/agents/**"
      - "scripts/**"
      - ".github/workflows/validate-personas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate personas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate persona and agent frontmatter
        run: python3 scripts/validate-frontmatter.py

      - name: Transpile personas to Claude Code and Cursor formats
        run: python3 scripts/transpile-personas.py --out "$RUNNER_TEMP/transpiled"
